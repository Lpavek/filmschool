<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Atlas - Node & Repertoire Edition</title>
    
    <!-- Mapbox -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <!-- Vis-Timeline & Vis-Network -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="neon-text">Cinematic Atlas</h2>
        <div class="controls">
            <div class="view-toggles">
                <button id="btn-map" class="active" onclick="switchView('map')">Map</button>
                <button id="btn-timeline" onclick="switchView('timeline')">Timeline</button>
                <button id="btn-network" onclick="switchView('network')" style="display: none;">Creators Node</button>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search person or movie..." onkeypress="handleEnter(event)">
                <button class="action-btn" onclick="searchAction()">Search</button>
            </div>
        </div>
    </header>

    <div id="main-content">
        <!-- Levý panel: Vizualizace (Mapa, Timeline, Node Network) -->
        <div id="visual-panel">
            <div id="map"></div>
            <div id="timeline-view">
                <h3 class="neon-text">Global Timeline</h3>
                <div id="timeline-container"></div>
            </div>
            <div id="network-view">
                <h3 class="neon-text">Creator Node Map</h3>
                <div id="network-container"></div>
            </div>
        </div>

        <!-- Pravý panel: Data a Repertoár -->
        <div id="data-panel">
            <!-- Vyhledávání / Analýza -->
            <div class="section" id="active-analysis-section">
                <h3>Active Analysis</h3>
                <div id="results-content">
                    <p style="color: #666;">Enter a creator or movie to begin.</p>
                </div>

                <!-- Detaily osoby / filmu -->
                <div id="entity-profile">
                    <div class="profile-header">
                        <img id="entity-photo" src="" alt="Profile">
                        <div class="profile-info">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <h4 id="entity-name" class="neon-text"></h4>
                                <div id="entity-actions"></div>
                            </div>
                            <div class="bio-text" id="entity-details"></div>
                            <div class="bio-text" id="entity-bio" style="margin-top: 10px;"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Filmografie / Obsah díla -->
            <div class="section" id="filmography-section" style="display:none;">
                <h3 id="filmography-title">Filmography</h3>
                <div id="filmography-list" class="list-container"></div>
            </div>

            <!-- Repertoár -->
            <div class="section">
                <div style="display: flex; justify-content: space-between; align-items: baseline;">
                    <h3>My Repertoire</h3>
                    <div class="repertoire-filters">
                        <select id="filter-visibility" onchange="renderRepertoire()">
                            <option value="main">Main (Active)</option>
                            <option value="hidden">Hidden</option>
                            <option value="all">All</option>
                        </select>
                        <select id="filter-sort" onchange="renderRepertoire()">
                            <option value="desc">Score (High-Low)</option>
                            <option value="asc">Score (Low-High)</option>
                        </select>
                    </div>
                </div>
                <div id="repertoire-list" class="repertoire-container"></div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-network@latest/standalone/umd/vis-network.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
