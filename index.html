<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Film School Atlas</title>
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎬</text></svg>">

    <!-- Mapbox GL JS -->
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <!-- Vis-Timeline -->
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2 class="neon-text">FILM SCHOOL ATLAS</h2>
        <div class="controls">
            <div class="view-toggles">
                <button id="btn-map" class="active" onclick="switchView('map')">MAP</button>
                <button id="btn-timeline" onclick="switchView('timeline')">TIMELINE</button>
            </div>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="SEARCH CREATOR OR MOVIE..." onkeypress="handleEnter(event)">
                <button class="action-btn" onclick="searchAction()">SEARCH</button>
            </div>
        </div>
    </header>

    <div id="main-content">
        <!-- Visual Panel (Left) -->
        <div id="visual-panel">
            <div id="map"></div>
            <div id="timeline-view">
                <h3 class="neon-text" id="timeline-title">GLOBAL TIMELINE</h3>
                <div id="timeline-container"></div>
            </div>

            <!-- Atmosphere Glow Intensity Slider (Centered horizontally at the bottom) -->
            <div class="glow-control">
                <span class="glow-label">GLOW</span>
                <input type="range" id="glowSlider" min="0" max="100" value="50" oninput="updateGlobeGlow(this.value)">
            </div>
            
            <!-- Left Sub-Inspector Panel -->
            <div id="sub-inspector-panel" class="sub-panel" style="display: none;">
                <div class="sub-panel-header">
                    <span class="sub-panel-title neon-text" id="sub-panel-title">FULL CREATOR ANALYSIS</span>
                    <button class="close-btn" onclick="closeSubInspector()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                    </button>
                </div>
                <div id="sub-panel-content"></div>
            </div>
        </div>

        <!-- Vertical Resizer Bar -->
        <div id="resizer"></div>

        <!-- Data Panel (Right) -->
        <div id="data-panel">
            
            <!-- Top Scrollable Content Container -->
            <div id="data-scroll-container">
                
                <!-- Active Analysis Section -->
                <div class="section" id="active-analysis-section">
                    <h3 id="analysis-section-title">ACTIVE ANALYSIS</h3>
                    <div id="results-content">
                        <p style="color: #64748b; font-size: 11px;">Search for a creator or movie to start analysis.</p>
                    </div>

                    <!-- Entity Profile -->
                    <div id="entity-profile" style="display: none;">
                        <div class="profile-header">
                            <img id="entity-photo" src="" alt="Profile">
                            <div class="profile-info">
                                <div style="display:flex; justify-content:space-between; align-items:center;">
                                    <h4 id="entity-name" class="neon-text"></h4>
                                    <div id="entity-actions" class="profile-actions-bar"></div>
                                </div>
                                <div class="bio-text-details" id="entity-details"></div>
                                <div class="bio-text" id="entity-bio" style="margin-top: 10px;"></div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Cast & Crew Breakdown -->
                <div class="section" id="creators-section" style="display:none;">
                    <h3>CAST & CREW</h3>
                    <div id="creators-breakdown" class="creators-grid"></div>
                </div>

                <!-- Commercial & Financial Performance Section -->
                <div class="section" id="financials-section" style="display:none;">
                    <h3>COMMERCIAL PERFORMANCE</h3>
                    <div id="financials-content"></div>
                </div>

                <!-- Filmography List -->
                <div class="section" id="filmography-section" style="display:none;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                        <h3 id="filmography-title" style="margin-bottom:0;">FILMOGRAPHY</h3>
                        <div style="display:flex; gap:6px;">
                            <button class="sort-toggle-btn" id="upcoming-toggle-btn" onclick="toggleUpcoming()" title="Toggle Planned / Future Movies">
                                🔮 <span>SHOW FUTURE</span>
                            </button>
                            <button class="sort-toggle-btn" id="filmography-sort-btn" onclick="toggleFilmographySort()" title="Toggle Order">
                                <span>NEWEST FIRST</span> ↕
                            </button>
                        </div>
                    </div>
                    <div id="filmography-list" class="list-container"></div>
                </div>

            </div>

            <!-- Horizontal Resizer Bar -->
            <div id="resizer-h"></div>

            <!-- Locked Bottom Repertoire Section -->
            <div class="section" id="repertoire-section">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <h3 style="margin-bottom:0;">MY REPERTOIRE</h3>
                    <div class="repertoire-filters">
                        <select id="filter-tab-sort" onchange="changeTabSortMode(this.value)" title="Sort Repertoire Categories">
                            <option value="recent">TABS: RECENT ADDED</option>
                            <option value="count">TABS: COUNT</option>
                            <option value="default">TABS: DEFAULT</option>
                        </select>
                        <select id="filter-visibility" onchange="renderRepertoire()">
                            <option value="main">ACTIVE</option>
                            <option value="wishlist">WISHLIST</option>
                            <option value="hidden">HIDDEN</option>
                            <option value="all">ALL</option>
                        </select>
                        <select id="filter-sort" onchange="renderRepertoire()">
                            <option value="desc">SCORE (HIGH-LOW)</option>
                            <option value="asc">SCORE (LOW-HIGH)</option>
                            <option value="alpha">A-Z</option>
                        </select>
                    </div>
                </div>

                <!-- Repertoire Category Tabs -->
                <div class="rep-tabs-wrapper">
                    <div class="rep-tabs" id="rep-tabs"></div>
                </div>

                <div id="repertoire-list" class="repertoire-container"></div>
            </div>

        </div>
    </div>

    <!-- External Libraries -->
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
