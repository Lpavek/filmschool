<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Atlas</title>
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --bg-color: #030303;
            --panel-bg: #0a0a0a;
            --neon-blue: #1010FF;
            --neon-orange: #FF6600;
            --neon-yellow: #FFD700;
            --text-main: #E0E0E0;
            --border: #1010FF;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        header {
            background-color: var(--bg-color);
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 20px rgba(16, 16, 255, 0.2);
            z-index: 10;
        }

        h2 {
            margin: 0;
            color: var(--neon-blue);
            font-weight: 900;
            letter-spacing: 4px;
            text-shadow: 0 0 10px rgba(16, 16, 255, 0.5);
        }

        .search-container {
            display: flex;
            gap: 15px;
        }

        input[type="text"] {
            padding: 10px 15px;
            background: var(--bg-color);
            border: 1px solid var(--neon-blue);
            color: var(--text-main);
            width: 300px;
            font-size: 14px;
            text-transform: uppercase;
            outline: none;
            transition: box-shadow 0.3s ease;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 10px rgba(16, 16, 255, 0.5);
        }

        button {
            padding: 10px 20px;
            background-color: var(--bg-color);
            color: var(--neon-orange);
            border: 1px solid var(--neon-orange);
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
        }

        button:hover {
            background-color: var(--neon-orange);
            color: var(--bg-color);
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.6);
        }

        #main-content {
            display: flex;
            flex: 1;
            height: calc(100vh - 80px);
        }

        #map-container {
            flex: 1;
            position: relative;
            border-right: 2px solid var(--neon-blue);
        }

        #map {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 100%;
        }

        #right-panel {
            width: 45%;
            display: flex;
            flex-direction: column;
            background-color: var(--panel-bg);
        }

        #timeline-container {
            flex: 1.2;
            padding: 20px;
            border-bottom: 2px solid var(--neon-blue);
            background-color: var(--bg-color);
            overflow: hidden;
        }

        #search-results-panel {
            flex: 0.8;
            padding: 20px;
            overflow-y: auto;
            background-color: var(--bg-color);
        }

        h3 {
            color: var(--neon-orange);
            margin-top: 0;
            font-weight: 700;
            letter-spacing: 2px;
        }

        .api-result-item {
            background: #000;
            border: 1px solid #222;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: border-color 0.3s ease;
        }

        .api-result-item:hover {
            border-color: var(--neon-blue);
        }

        .api-result-info h4 { margin: 0 0 5px 0; color: var(--neon-blue); }
        .api-result-info p { margin: 0; font-size: 11px; color: #888; }

        .custom-marker {
            background-color: var(--neon-orange);
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 2px solid var(--bg-color);
            cursor: pointer;
            box-shadow: 0 0 15px var(--neon-yellow);
            transition: transform 0.3s ease;
        }

        .custom-marker:hover {
            transform: scale(1.5);
        }

        .mapboxgl-popup-content {
            background-color: var(--bg-color);
            color: var(--text-main);
            border-radius: 0;
            border: 1px solid var(--neon-orange);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            text-transform: uppercase;
        }

        .mapboxgl-popup-anchor-bottom .mapboxgl-popup-tip {
            border-top-color: var(--neon-orange);
        }

        /* Vis-Timeline overrides for dark/neon theme */
        .vis-timeline { border: none; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        .vis-item { background-color: var(--bg-color); border: 1px solid var(--neon-blue); color: var(--text-main); box-shadow: 0 0 5px rgba(16, 16, 255, 0.3); }
        .vis-item .vis-item-content { padding: 5px 10px; font-size: 12px; }
        .vis-item.vis-selected { border-color: var(--neon-orange); background-color: var(--panel-bg); box-shadow: 0 0 10px rgba(255, 102, 0, 0.5); }
        .vis-time-axis .vis-text { color: var(--neon-blue); font-weight: bold; }
        .vis-time-axis .vis-grid.vis-minor { border-color: #222; }
        .vis-time-axis .vis-grid.vis-major { border-color: var(--neon-blue); }
    </style>
</head>
<body>

    <header>
        <h2>Cinematic Atlas</h2>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search director (e.g. Refn)..." onkeypress="handleEnter(event)">
            <button onclick="searchAction()">Search</button>
        </div>
    </header>

    <div id="main-content">
        <div id="map-container">
            <div id="map"></div>
        </div>
        <div id="right-panel">
            <div id="timeline-container">
                <h3 id="timeline-title">Director Timeline</h3>
                <div id="timeline"></div>
            </div>
            <div id="search-results-panel">
                <h3 id="panel-title">Database Records</h3>
                <div id="results-content">
                    <p style="color: #555;">Awaiting query. Enter a director's name to fetch filmography and production locations.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <script>
        const TMDB_API_KEY = '8818385dc34c1143c1b2589f2d36f790'; /* FIRST */
        mapboxgl.accessToken = 'pk.eyJ1IjoibHVxcWV5IiwiYSI6ImNtdmF4MXg3OTA4c3oyeXI0aTgzNnM5MW4ifQ.ZoG892NR3JW26wh-ZGdPRg'; /* SECOND */

        let map;
        let timeline;
        let timelineItems;
        let currentMarkers = [];

        function initApp() {
            map = new mapboxgl.Map({
                container: 'map',
                style: 'mapbox://styles/mapbox/dark-v11',
                center: [10, 45],
                zoom: 2
            });

            timelineItems = new vis.DataSet([]);
            const container = document.getElementById('timeline');
            const options = {
                start: '1990-01-01',
                end: '2030-01-01',
                height: '100%',
                zoomMin: 1000 * 60 * 60 * 24 * 365,
                margin: { item: 10, axis: 5 }
            };
            timeline = new vis.Timeline(container, timelineItems, options);
        }

        initApp();

        function handleEnter(e) {
            if (e.key === 'Enter') searchAction();
        }

        async function searchAction() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = `<p>Querying TMDB for: <span style="color:var(--neon-blue)">${query}</span>...</p>`;

            if (TMDB_API_KEY === '8818385dc34c1143c1b2589f2d36f790') {
                resultsContent.innerHTML = `<p style="color:var(--neon-orange)">API KEY MISSING. PLEASE INSERT TMDB API KEY IN THE CODE (FIRST).</p>`;
                return;
            }

            try {
                const response = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await response.json();

                if (data.results && data.results.length > 0) {
                    renderPersonResults(data.results.slice(0, 5));
                } else {
                    resultsContent.innerHTML = `<p>No records found in the database.</p>`;
                }
            } catch (err) {
                resultsContent.innerHTML = `<p style="color:var(--neon-orange)">Database connection error.</p>`;
            }
        }

        function renderPersonResults(persons) {
            const resultsContent = document.getElementById('results-content');
            resultsContent.innerHTML = '';

            persons.forEach(person => {
                const knownFor = person.known_for.map(item => item.title || item.name).join(', ');
                const div = document.createElement('div');
                div.className = 'api-result-item';
                div.innerHTML = `
                    <div class="api-result-info">
                        <h4>${person.name}</h4>
                        <p>Known for: ${knownFor || 'N/A'}</p>
                    </div>
                    <button onclick="loadDirectorProfile(${person.id}, '${person.name.replace(/'/g, "\\'")}')">Analyze</button>
                `;
                resultsContent.appendChild(div);
            });
        }

        async function loadDirectorProfile(personId, personName) {
            document.getElementById('timeline-title').innerText = `FILMOGRAPHY: ${personName.toUpperCase()}`;
            document.getElementById('results-content').innerHTML = `<p>Processing filmography for <span style="color:var(--neon-blue)">${personName}</span>...</p>`;
            
            clearMapMarkers();
            timelineItems.clear();

            try {
                const response = await fetch(`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${TMDB_API_KEY}`);
                const data = await response.json();

                let directorCredits = data.crew.filter(credit => credit.job === 'Director');
                
                if (directorCredits.length === 0) {
                    directorCredits = data.cast.slice(0, 15);
                }

                directorCredits = directorCredits.filter(movie => movie.release_date);
                directorCredits.sort((a, b) => new Date(a.release_date) - new Date(b.release_date));

                const timelineData = directorCredits.map((movie, index) => ({
                    id: index,
                    content: movie.title,
                    start: movie.release_date
                }));

                timelineItems.add(timelineData);
                
                if(timelineData.length > 0) {
                    timeline.fit();
                }

                document.getElementById('results-content').innerHTML = `<p>Mapping production locations...</p>`;
                await mapProductionLocations(directorCredits.slice(0, 10));

                document.getElementById('results-content').innerHTML = `<p style="color:var(--neon-blue)">Analysis complete. Map and timeline updated.</p>`;

            } catch (err) {
                console.error(err);
                document.getElementById('results-content').innerHTML = `<p style="color:var(--neon-orange)">Error extracting profile data.</p>`;
            }
        }

        async function mapProductionLocations(movies) {
            if (mapboxgl.accessToken === 'pk.eyJ1IjoibHVxcWV5IiwiYSI6ImNtdmF4MXg3OTA4c3oyeXI0aTgzNnM5MW4ifQ.ZoG892NR3JW26wh-ZGdPRg') {
                console.warn("Mapbox API key missing. Skipping map population.");
                return;
            }

            for (const movie of movies) {
                try {
                    const res = await fetch(`https://api.themoviedb.org/3/movie/${movie.id}?api_key=${TMDB_API_KEY}`);
                    const details = await res.json();

                    if (details.production_countries && details.production_countries.length > 0) {
                        const countryName = details.production_countries[0].name;
                        
                        const geoUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(countryName)}.json?access_token=${mapboxgl.accessToken}`;
                        const geoRes = await fetch(geoUrl);
                        const geoData = await geoRes.json();

                        if (geoData.features && geoData.features.length > 0) {
                            const lng = geoData.features[0].center[0];
                            const lat = geoData.features[0].center[1];

                            addCustomMarker(lng, lat, movie.title, movie.release_date, countryName);
                        }
                    }
                } catch (e) {
                    console.error("Geocoding failed for movie:", movie.title);
                }
            }
        }

        function addCustomMarker(lng, lat, title, date, location) {
            const el = document.createElement('div');
            el.className = 'custom-marker';

            const popupHTML = `
                <div style="font-size: 14px; font-weight: bold; color: var(--neon-blue); margin-bottom: 5px;">${title}</div>
                <div style="font-size: 10px; color: #888;">YEAR: ${date.split('-')[0]}</div>
                <div style="font-size: 10px; color: #888;">LOCATION: ${location}</div>
            `;

            const popup = new mapboxgl.Popup({ offset: 15 }).setHTML(popupHTML);

            const marker = new mapboxgl.Marker(el)
                .setLngLat([lng, lat])
                .setPopup(popup)
                .addTo(map);

            currentMarkers.push(marker);
        }

        function clearMapMarkers() {
            currentMarkers.forEach(marker => marker.remove());
            currentMarkers = [];
        }
    </script>
</body>
</html>
