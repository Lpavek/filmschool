<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinematic Atlas - Study Edition</title>
    
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.css" rel="stylesheet">
    <link href="https://unpkg.com/vis-timeline@latest/styles/vis-timeline-graph2d.min.css" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --bg-color: #030303;
            --panel-bg: #0a0a0a;
            --neon-blue: #5c5cff;
            --neon-orange: #FF6600;
            --text-main: #E0E0E0;
            --border: #2222aa;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-main);
            display: flex; flex-direction: column; height: 100vh;
            letter-spacing: 1px; text-transform: uppercase;
        }

        .neon-text {
            color: var(--neon-blue);
            text-shadow: 0 0 8px rgba(92, 92, 255, 0.5);
            font-weight: bold;
        }

        header {
            background-color: var(--bg-color); padding: 15px 30px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }

        h2 { margin: 0; letter-spacing: 3px; }

        .controls { display: flex; gap: 20px; align-items: center; }

        .view-toggles button {
            background: transparent; border: 1px solid var(--neon-blue);
            color: var(--neon-blue); padding: 8px 15px; margin-right: 5px; cursor: pointer;
        }
        .view-toggles button.active { background: var(--neon-blue); color: var(--bg-color); }
        .view-toggles button.compare-btn { border-color: var(--neon-orange); color: var(--neon-orange); }
        .view-toggles button.compare-btn:hover { background: var(--neon-orange); color: var(--bg-color); }

        .search-container { display: flex; gap: 10px; }
        input[type="text"] {
            padding: 8px 15px; background: var(--bg-color); border: 1px solid var(--neon-blue);
            color: var(--text-main); width: 250px; text-transform: uppercase; outline: none;
        }
        button.action-btn {
            padding: 8px 15px; background: var(--bg-color); color: var(--neon-orange);
            border: 1px solid var(--neon-orange); cursor: pointer; font-weight: bold; text-transform: uppercase;
        }
        button.action-btn:hover { background: var(--neon-orange); color: var(--bg-color); }

        #main-content { display: flex; flex: 1; height: calc(100vh - 70px); overflow: hidden; }

        #visual-panel { flex: 1.3; position: relative; border-right: 1px solid var(--border); }
        #map, #timeline-view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
        #timeline-view { display: none; padding: 20px; box-sizing: border-box; background: var(--bg-color); }
        #timeline-container { height: 90%; }

        #data-panel { width: 35%; display: flex; flex-direction: column; background: var(--panel-bg); overflow-y: auto; }

        .section { padding: 20px; border-bottom: 1px solid #1a1a1a; }
        h3 { color: var(--neon-orange); margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 5px; }

        #director-profile { display: none; gap: 15px; margin-top: 15px; }
        #director-photo { width: 90px; height: 135px; object-fit: cover; border: 1px solid var(--neon-blue); }
        .bio-text { font-size: 11px; color: #999; text-transform: none; line-height: 1.4; max-height: 100px; overflow-y: auto; }

        .list-item {
            background: #050505; border: 1px solid #222; padding: 10px; margin-bottom: 5px;
            display: flex; justify-content: space-between; align-items: center; transition: 0.2s;
        }
        .list-item:hover { border-color: var(--neon-blue); }

        .custom-marker {
            background: var(--neon-orange); width: 12px; height: 12px; border-radius: 50%;
            border: 2px solid var(--bg-color); cursor: pointer; box-shadow: 0 0 10px var(--neon-orange);
        }
        .mapboxgl-popup-content { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--neon-orange); text-transform: uppercase; }

        .vis-timeline { border: none; font-family: inherit; }
        .vis-item { background: var(--bg-color); border: 1px solid var(--neon-blue); color: var(--neon-blue); }
        .vis-time-axis .vis-text { color: var(--text-main); }
        .vis-label { color: var(--neon-orange); font-weight: bold; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: var(--neon-blue); }
    </style>
</head>
<body>

    <header>
        <h2 class="neon-text">Cinematic Atlas</h2>
        <div class="controls">
            <div class="view-toggles">
                <button id="btn-map" class="active" onclick="switchView('map')">Map</button>
                <button id="btn-timeline" onclick="switchView('timeline')">Timeline</button>
                <button class="compare-btn" onclick="compareRepertoire()">Analyze Repertoire</button>
            </div>
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search director..." onkeypress="handleEnter(event)">
                <button class="action-btn" onclick="searchAction()">Search</button>
            </div>
        </div>
    </header>

    <div id="main-content">
        <div id="visual-panel">
            <div id="map"></div>
            <div id="timeline-view">
                <h3 class="neon-text" id="timeline-title">Timeline Context</h3>
                <div id="timeline-container"></div>
            </div>
        </div>

        <div id="data-panel">
            <div class="section">
                <h3>Active Subject</h3>
                <div id="results-content"><p style="color: #666; font-size:11px;">Search or load a director from repertoire.</p></div>
                
                <div id="director-profile">
                    <img id="director-photo" src="" alt="Photo">
                    <div>
                        <h4 id="director-name" class="neon-text" style="margin:0 0 5px 0;"></h4>
                        <div style="font-size: 10px; color: var(--neon-orange); margin-bottom: 2px;" id="director-birth"></div>
                        <div style="font-size: 10px; color: #888; margin-bottom: 5px;" id="director-place"></div>
                        <div class="bio-text" id="director-bio"></div>
                        <button class="action-btn" style="margin-top: 10px; font-size: 10px;" onclick="saveToRepertoire()">+ Save to Repertoire</button>
                    </div>
                </div>
            </div>

            <div class="section">
                <h3>Filmography</h3>
                <div id="filmography-list" style="font-size: 11px; color: #888;">No data loaded.</div>
            </div>

            <div class="section">
                <h3>My Repertoire</h3>
                <div id="repertoire-list"></div>
            </div>
        </div>
    </div>

    <script src="https://api.mapbox.com/mapbox-gl-js/v3.0.0/mapbox-gl.js"></script>
    <script type="text/javascript" src="https://unpkg.com/vis-timeline@latest/standalone/umd/vis-timeline-graph2d.min.js"></script>

    <script>
        const TMDB_API_KEY = '8818385dc34c1143c1b2589f2d36f790'; /* FIRST */
        mapboxgl.accessToken = 'pk.eyJ1IjoibHVxcWV5IiwiYSI6ImNtdmF4MXg3OTA4c3oyeXI0aTgzNnM5MW4ifQ.ZoG892NR3JW26wh-ZGdPRg'; /* SECOND */

        let map, timeline;
        let timelineItems = new vis.DataSet([]);
        let timelineGroups = new vis.DataSet([]);
        let currentMarkers = [];
        let currentDirector = null;
        let repertoire = JSON.parse(localStorage.getItem('cinematicRepertoire')) || [];

        function initApp() {
            map = new mapboxgl.Map({
                container: 'map', style: 'mapbox://styles/mapbox/dark-v11',
                center: [10, 45], zoom: 1.8, projection: 'globe'
            });

            let userInteracted = false;
            function rotateGlobe() {
                if (userInteracted) return;
                if (map.getZoom() < 3) {
                    const center = map.getCenter();
                    center.lng -= 360 / (180 * 60);
                    map.easeTo({ center, duration: 0, easing: (n) => n });
                }
            }
            ['mousedown', 'touchstart', 'dragstart', 'zoomstart'].forEach(e => map.on(e, () => userInteracted = true));
            map.on('moveend', rotateGlobe);
            rotateGlobe();

            // Trik pro správnou inicializaci timeline - na chvíli zviditelníme kontejner
            document.getElementById('timeline-view').style.display = 'block';
            timeline = new vis.Timeline(document.getElementById('timeline-container'), timelineItems, timelineGroups, {
                start: '1960-01-01', end: '2030-01-01', height: '100%', margin: { item: 10 }
            });
            document.getElementById('timeline-view').style.display = 'none';

            renderRepertoire();
        }
        initApp();

        function switchView(view) {
            document.getElementById('btn-map').classList.remove('active');
            document.getElementById('btn-timeline').classList.remove('active');
            document.getElementById('map').style.display = 'none';
            document.getElementById('timeline-view').style.display = 'none';

            if (view === 'map') {
                document.getElementById('btn-map').classList.add('active');
                document.getElementById('map').style.display = 'block';
                map.resize();
            } else {
                document.getElementById('btn-timeline').classList.add('active');
                document.getElementById('timeline-view').style.display = 'block';
                timeline.redraw();
            }
        }

        function handleEnter(e) { if (e.key === 'Enter') searchAction(); }

        async function searchAction() {
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            const resDiv = document.getElementById('results-content');
            resDiv.innerHTML = `<p class="neon-text">Querying: ${query}...</p>`;
            document.getElementById('director-profile').style.display = 'none';
            document.getElementById('filmography-list').innerHTML = '';

            try {
                const res = await fetch(`https://api.themoviedb.org/3/search/person?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(query)}`);
                const data = await res.json();

                if (data.results && data.results.length > 0) {
                    resDiv.innerHTML = '';
                    data.results.slice(0, 4).forEach(person => {
                        const div = document.createElement('div');
                        div.className = 'list-item';
                        div.innerHTML = `<span><strong class="neon-text">${person.name}</strong></span>
                                         <button class="action-btn" style="font-size:10px; padding:5px 10px;" onclick="analyzeDirector(${person.id})">Select</button>`;
                        resDiv.appendChild(div);
                    });
                } else { resDiv.innerHTML = `<p>Not found.</p>`; }
            } catch (err) { resDiv.innerHTML = `<p style="color:var(--neon-orange)">Connection error.</p>`; }
        }

        async function analyzeDirector(personId) {
            document.getElementById('results-content').innerHTML = `<p class="neon-text">Analyzing profile...</p>`;
            clearVisuals();

            try {
                const detailRes = await fetch(`https://api.themoviedb.org/3/person/${personId}?api_key=${TMDB_API_KEY}`);
                const detailData = await detailRes.json();
                
                const creditRes = await fetch(`https://api.themoviedb.org/3/person/${personId}/movie_credits?api_key=${TMDB_API_KEY}`);
                const creditData = await creditRes.json();

                // Sort: NEJNOVĚJŠÍ PRVNÍ (Descending)
                let directedMovies = creditData.crew.filter(c => c.job === 'Director' && c.release_date);
                directedMovies.sort((a, b) => new Date(b.release_date) - new Date(a.release_date));

                currentDirector = { id: detailData.id, name: detailData.name };

                // Vykreslení UI - TADY BYLA CHYBA (\vert{}\vert{} místo ||)
                document.getElementById('director-profile').style.display = 'flex';
                document.getElementById('director-name').innerText = detailData.name;
                document.getElementById('director-birth').innerText = `BORN: ${detailData.birthday \vert{}\vert{} 'UNKNOWN'}${detailData.deathday ? ' | DIED: '+detailData.deathday : ''}`;
                document.getElementById('director-place').innerText = `FROM: ${detailData.place_of_birth || 'UNKNOWN'}`;
                document.getElementById('director-bio').innerText = detailData.biography || 'No bio available.';
                
                const imgEl = document.getElementById('director-photo');
                imgEl.src = detailData.profile_path ? `https://image.tmdb.org/t/p/w200${detailData.profile_path}` : '';
                imgEl.style.display = detailData.profile_path ? 'block' : 'none';

                renderFilmography(directedMovies);
                
                // Timeline for single director
                timelineGroups.add({ id: detailData.id, content: detailData.name });
                directedMovies.forEach(m => {
                    timelineItems.add({ id: m.id, group: detailData.id, content: m.title, start: m.release_date, type: 'point' });
                });
                if(detailData.birthday) timelineItems.add({ id: 'birth', group: detailData.id, content: 'Born', start: detailData.birthday, type: 'background', style: 'background-color: rgba(255,102,0,0.2);' });
                timeline.fit();

                document.getElementById('results-content').innerHTML = ``;

                // Izolovaný try/catch pro geolokaci, aby nespadl zbytek, když selže Mapbox klíč
                try {
                    if (detailData.place_of_birth) await geocodeAndPlot(detailData.place_of_birth, `${detailData.name} - Origin`);
                } catch(e) { console.warn("Geocoding failed."); }

            } catch (err) {
                console.error(err);
                document.getElementById('results-content').innerHTML = `<p style="color:var(--neon-orange)">Data fetch error.</p>`;
            }
        }

        function renderFilmography(movies) {
            const listDiv = document.getElementById('filmography-list');
            listDiv.innerHTML = '';
            movies.forEach(m => {
                const year = m.release_date ? m.release_date.split('-')[0] : 'N/A';
                listDiv.innerHTML += `
                    <div class="list-item" style="cursor:pointer;" onclick="openIMDb(${m.id})" title="View on IMDb">
                        <div><strong class="neon-text">${year}</strong> - ${m.title}</div>
                        <div style="font-size:10px; color:#555;">IMDb ↗</div>
                    </div>`;
            });
        }

        async function openIMDb(movieId) {
            try {
                const res = await fetch(`https://api.themoviedb.org/3/movie/${movieId}/external_ids?api_key=${TMDB_API_KEY}`);
                const data = await res.json();
                if(data.imdb_id) window.open(`https://www.imdb.com/title/${data.imdb_id}/`, '_blank');
                else alert('IMDb record not found.');
            } catch(e) { console.error(e); }
        }

        // --- SROVNÁVACÍ REPERTOÁR MÓD ---
        async function compareRepertoire() {
            if (repertoire.length === 0) return alert("Repertoire is empty.");
            
            clearVisuals();
            document.getElementById('results-content').innerHTML = `<p class="neon-text">Loading shared context for ${repertoire.length} directors...</p>`;
            document.getElementById('director-profile').style.display = 'none';
            document.getElementById('filmography-list').innerHTML = '<p>Filmography merged in Timeline View.</p>';
            
            switchView('timeline');

            for (const dir of repertoire) {
                try {
                    timelineGroups.add({ id: dir.id, content: `<span class="neon-text">${dir.name}</span>` });

                    const detailRes = await fetch(`https://api.themoviedb.org/3/person/${dir.id}?api_key=${TMDB_API_KEY}`);
                    const detailData = await detailRes.json();
                    
                    if (detailData.place_of_birth) geocodeAndPlot(detailData.place_of_birth, `${dir.name} (Origin)`);

                    const creditRes = await fetch(`https://api.themoviedb.org/3/person/${dir.id}/movie_credits?api_key=${TMDB_API_KEY}`);
                    const creditData = await creditRes.json();
                    const movies = creditData.crew.filter(c => c.job === 'Director' && c.release_date);

                    movies.forEach(m => {
                        timelineItems.add({ id: `${dir.id}-${m.id}`, group: dir.id, content: m.title, start: m.release_date, type: 'point' });
                    });
                } catch (e) { console.warn("Failed to load context for", dir.name); }
            }
            timeline.fit();
            document.getElementById('results-content').innerHTML = `<p style="color:var(--neon-orange)">Contextual Comparison Ready.</p>`;
        }

        async function geocodeAndPlot(locationStr, label) {
            if (mapboxgl.accessToken === 'SEM_VLOZ_SVUJ_MAPBOX_KLIC') return;
            const geoUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${encodeURIComponent(locationStr)}.json?access_token=${mapboxgl.accessToken}`;
            const geoRes = await fetch(geoUrl);
            const geoData = await geoRes.json();
            if (geoData.features && geoData.features.length > 0) {
                const lng = geoData.features[0].center[0], lat = geoData.features[0].center[1];
                const el = document.createElement('div'); el.className = 'custom-marker';
                const popup = new mapboxgl.Popup({ offset: 15 }).setHTML(`<div style="font-weight:bold; color:var(--neon-orange);">${label}</div><div style="font-size:10px;">${locationStr}</div>`);
                const marker = new mapboxgl.Marker(el).setLngLat([lng, lat]).setPopup(popup).addTo(map);
                currentMarkers.push(marker);
            }
        }

        function clearVisuals() {
            currentMarkers.forEach(m => m.remove());
            currentMarkers = [];
            timelineItems.clear();
            timelineGroups.clear();
        }

        function saveToRepertoire() {
            if (!currentDirector) return;
            if (!repertoire.some(d => d.id === currentDirector.id)) {
                repertoire.push({ id: currentDirector.id, name: currentDirector.name });
                localStorage.setItem('cinematicRepertoire', JSON.stringify(repertoire));
                renderRepertoire();
            }
        }

        function renderRepertoire() {
            const listDiv = document.getElementById('repertoire-list');
            listDiv.innerHTML = '';
            if (repertoire.length === 0) { listDiv.innerHTML = '<p style="font-size:11px; color:#666;">Repertoire is empty.</p>'; return; }
            repertoire.forEach((dir, index) => {
                const div = document.createElement('div');
                div.className = 'list-item';
                div.innerHTML = `
                    <span class="neon-text">${dir.name}</span>
                    <div>
                        <button class="action-btn" style="padding:3px 8px; font-size:10px;" onclick="analyzeDirector(${dir.id})">Load</button>
                        <button style="background:transparent; color:#666; border:none; cursor:pointer;" onclick="removeFromRepertoire(${index})">✕</button>
                    </div>`;
                listDiv.appendChild(div);
            });
        }
    </script>
</body>
</html>
